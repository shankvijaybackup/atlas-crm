name: deploy

# Every push to main deploys to Cloud Run. The run record this produces is what
# the alert-to-resolution agent reads to establish the deploy timeline: the
# failing deploy is the last successful run completed at or before alert onset,
# and the run before it is the last-good baseline. Diffing those two head SHAs
# gives the commits that actually went live.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # --update-env-vars, not --set-env-vars: the live service holds
          # AW_API_KEY and friends that are not in this repo, and --set would
          # drop them.
          gcloud run deploy atlas-crm-ops \
            --project atomicwork-gcp-demo \
            --region asia-south1 \
            --source . \
            --min-instances 1 --max-instances 1 \
            --update-env-vars "CONTROL_TOKEN=${{ secrets.CONTROL_TOKEN }}" \
            --allow-unauthenticated \
            --quiet

      - name: Report the deployed revision
        run: |
          gcloud run services describe atlas-crm-ops \
            --project atomicwork-gcp-demo --region asia-south1 \
            --format='value(status.latestReadyRevisionName,status.url)'
