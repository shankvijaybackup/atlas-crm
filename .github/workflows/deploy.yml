name: deploy

# Every push to main deploys to Cloud Run. The run record this produces is what
# the Major Incident RCA Coworker reads to establish the deploy timeline: the
# failing deploy is the last successful run completed at or before alert onset,
# and the run before it is the last-good baseline. Diffing those two head SHAs
# gives the commits that actually went live, which is what stops it blaming a
# PR that has not shipped yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: atomicwork-gcp-demo
  REGION: asia-south1
  SERVICE: atlas-crm-ops

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to mint the OIDC token for WIF
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        # Workload Identity Federation, not a service account key. The org
        # enforces iam.disableServiceAccountKeyCreation, so no key exists to
        # put in a secret even if we wanted one.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/735974883480/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-deployer@atomicwork-gcp-demo.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # --update-env-vars, not --set-env-vars: the live service holds
        # AW_API_KEY and friends that are not in this repo, and --set would
        # drop them, which silently disables the incident cluster.
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --source . \
            --min-instances 1 --max-instances 1 \
            --update-env-vars "CONTROL_TOKEN=${{ secrets.CONTROL_TOKEN }},DEPLOYED_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Report the deployed revision
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format="value(status.latestReadyRevisionName,status.url)"
