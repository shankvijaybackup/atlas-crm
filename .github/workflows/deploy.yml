name: deploy

# Every push to main builds the image and deploys it to Azure Container Apps.
# The run record this produces is what the Major Incident RCA Coworker reads to
# establish the deploy timeline: the failing deploy is the last successful run
# completed at or before alert onset, and the run before it is the last-good
# baseline. Diffing those two head SHAs gives the commits that actually went
# live, which is what stops it blaming a PR that has not shipped yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas-crm
  cancel-in-progress: false

env:
  RESOURCE_GROUP: entra-unlock-rg
  CONTAINER_APP: atlas-crm-ops
  REGISTRY: cac1f270567facr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build the image
        # `az acr build` builds in the registry, so the runner needs no Docker.
        # Tagging with the commit SHA is what makes a deployed revision traceable
        # back to a commit.
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --image "atlas-crm-ops:${GITHUB_SHA}" \
            --image "atlas-crm-ops:latest" \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${REGISTRY}.azurecr.io/atlas-crm-ops:${GITHUB_SHA}" \
            --set-env-vars "DEPLOYED_SHA=${GITHUB_SHA}" \
            --output none

      - name: Report the deployed revision
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "{revision:properties.latestReadyRevisionName,url:properties.configuration.ingress.fqdn}" \
            -o tsv
